version: '3'

vars:
  BINARY: gantry
  BUILD_DIR: bin
  REPORT_DIR: reports
  COVERAGE_DIR: coverage
  VERSION: "Make"

tasks:
  default:
    cmds:
      - task: install
      - task: fmt
      - task: lint
      - task: test
      - task: integration-test

  devcontainers:
    desc: Regenerates .devcontainer/devcontainer.json with gantry itself.
    deps: [build]
    dir: .devcontainer
    cmds:
      - ../bin/gantry build --config gantry.yaml --write

  devcontainers-check:
    desc: Fails if the committed devcontainer.json differs from what gantry generates.
    cmds:
      - task: devcontainers
      - git diff --exit-code -- .devcontainer/devcontainer.json

  install:
    desc: Downloads Golang module dependencies.
    cmds:
      - go mod download

  install-ci:
    desc: Install packages and CI/CD tools.
    cmds:
      - task: install
      # Exact versions so CI is reproducible; tracked by Renovate (see #30).
      - go install github.com/jstemmer/go-junit-report/v2@v2.1.0
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
  
  build:
    desc: Builds gantry binary.
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "-X main.version=${VERSION}" -o {{.BUILD_DIR}}/{{.BINARY}} .

  fmt:
    desc: Formats Golang code.
    cmds:
      - go fmt $(go list ./...)
  
  lint:
    desc: Lints Golang code.
    cmds:
      - golangci-lint run

  test:
    desc: Run Golang tests.
    cmds:
      - go test -v ./... 2>&1

  test-ci:
    desc: Run Golang tests and write JUnit (reports/) and coverage (coverage/) reports.
    set: [pipefail]
    cmds:
      - mkdir -p {{.REPORT_DIR}} {{.COVERAGE_DIR}}
      - go test -coverprofile {{.COVERAGE_DIR}}/coverage.out -v ./... 2>&1 | go-junit-report -set-exit-code -iocopy -out {{.REPORT_DIR}}/unit.xml
      - go tool cover -html={{.COVERAGE_DIR}}/coverage.out -o {{.COVERAGE_DIR}}/coverage.html

  integration-test:
    desc: Run integration tests (requires network access).
    cmds:
      - GANTRY_INTEGRATION_TESTS=1 go test -v -run Integration ./... 2>&1

  integration-test-ci:
    desc: Run integration tests and write JUnit (reports/) and coverage (coverage/) reports.
    set: [pipefail]
    cmds:
      - mkdir -p {{.REPORT_DIR}} {{.COVERAGE_DIR}}
      - GANTRY_INTEGRATION_TESTS=1 go test -coverprofile {{.COVERAGE_DIR}}/coverage-integration.out -v -run Integration ./... 2>&1 | go-junit-report -set-exit-code -iocopy -out {{.REPORT_DIR}}/integration.xml
