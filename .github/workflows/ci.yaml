name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

# Cancel superseded PR runs (Renovate force-pushes in bursts). Runs on main always
# finish, so octocov keeps its baseline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; jobs that need more ask for it explicitly. Job-level
# permissions replace this block for that job (they don't merge).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Cache Go tool binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin
        # os/arch matter: ~/go/bin holds compiled binaries shared with the arm64 test leg.
        key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Taskfile.yaml', 'go.mod') }}
    - name: Install dependencies and tools
      run: task install-ci
    - name: Lint
      run: task lint

  test:
    # Explicit, or GitHub derives the check name from every matrix dimension
    # (including the runner label), which would silently rename a required check
    # whenever the runner changes.
    name: test (${{ matrix.arch }})
    strategy:
      # An arm64-only failure should still report the amd64 result and vice versa.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Free for public repositories; there is no `ubuntu-latest-arm`.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      checks: write # publish-unit-test-result-action
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Cache Go tool binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin
        key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Taskfile.yaml', 'go.mod') }}
    - name: Install dependencies and tools
      run: task install-ci
    - name: Unit tests
      run: task test-ci
    - name: Integration tests
      # Run even if unit tests failed, so one report shows both tiers.
      if: ${{ !cancelled() }}
      run: task integration-test-ci
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
      if: ${{ !cancelled() }}
      with:
        files: reports/*.xml
        # Unique per leg; the action's default name would collide across the matrix.
        check_name: Test Results (${{ matrix.arch }})
        # Check runs only: octocov owns the PR comment, and commenting would need
        # pull-requests: write on this job too.
        comment_mode: off
    - name: Upload coverage profiles
      # amd64 only: coverage is a property of the source, not the runner, and the
      # report job expects one fixed artifact name.
      if: ${{ !cancelled() && matrix.arch == 'amd64' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-profiles
        path: coverage/*.out
        if-no-files-found: error

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      # The go-fmt hook (dnephin/pre-commit-golang) is `language: script` and runs
      # whatever gofmt is on PATH, so pin the toolchain instead of using the runner's.
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Run pre-commit hooks via prek
      uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
      with:
        prek-version: v0.5.11 # github-releases/j178/prek

  devcontainer:
    # Dogfoods gantry: regenerate .devcontainer/devcontainer.json from its overlays
    # (the shared ivanklee86/devcontainers base + gantry.libsonnet) and fail if the
    # committed file differs. Not a required check: the base tracks upstream `main`,
    # so upstream changes can turn this red until someone runs `task devcontainers`.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Check devcontainer.json is up to date
      run: task devcontainers-check

  release-check:
    # Builds what release.yaml publishes (all six binaries + the multi-arch image),
    # minus publishing and signing, so a broken .goreleaser.yaml or Dockerfile fails
    # here instead of after a tag and GitHub Release already exist.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Check GoReleaser config
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: v2.20.3 # github-releases/goreleaser/goreleaser
        args: check
    - name: Snapshot build
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: v2.20.3 # github-releases/goreleaser/goreleaser
        args: release --snapshot --clean --skip=publish,sign,sbom

  report:
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # octocov PR comment
      actions: write       # octocov artifact:// datastore (reads/deletes prior report artifacts)
    steps:
    - name: Checkout code
      # octocov needs .octocov.yml and the repo for path normalization.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download coverage profiles
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-profiles
        path: coverage
    - name: Report coverage via octocov
      # SHA-pinned rather than the mutable tag: this step runs with actions: write.
      uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
      with:
        config: .octocov.yml
        version: v0.83.5 # github-releases/k1LoW/octocov
